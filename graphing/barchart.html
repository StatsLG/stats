<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bar Chart</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="/style/bctcstyle.css">

  <style>
    .section-title {
      margin: 0 0 12px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.75;
    }

    .primary-action {
      margin-top: 12px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
    }

    .back-btn {
      width: 100%;
    }

    .control-note {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 6px;
    }

    .group-color-controls {
      display: none;
    }

    .group-color-controls.active {
      display: block;
    }

    .single-color-controls.hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="wrap">

  <aside class="panel left">

    <!-- NAVIGATION -->
    <div class="card">
      <button class="btn back-btn" onclick="history.back()">
        ← Go Back
      </button>
    </div>

    <!-- DATA -->
    <div class="card">

      <div class="section-title">Data</div>

      <label>Upload data (CSV / Excel)</label>
      <input id="file" type="file" accept=".csv,.xlsx" />

      <button class="btn" id="loadBtn">
        Load File
      </button>

      <button class="btn" id="sampleBtn">
        Load Sample
      </button>

    </div>

    <!-- VARIABLES -->
    <div class="card">

      <div class="section-title">Variables</div>

      <label>Column</label>
      <select id="colSelect">
        <option value="">—</option>
      </select>

      <label>Group by</label>
      <select id="groupSelect">
        <option value="">None</option>
      </select>

      <label>Summarize by</label>
      <select id="summary">
        <option value="count">Count</option>
        <option value="percent">Percent</option>
      </select>

      <button class="btn primary-action" id="drawBarBtn">
        Draw Bar Chart
      </button>

    </div>

    <!-- LABELS -->
    <div class="card">

      <div class="section-title">Labels</div>

      <label>Chart Title</label>
      <input
        id="titleInput"
        type="text"
        placeholder="Chart Title"
      />

      <label>X-Axis Label</label>
      <input
        id="xlabelInput"
        type="text"
        placeholder="X Axis Label"
      />

      <label>Y-Axis Label</label>
      <input
        id="ylabelInput"
        type="text"
        placeholder="Y Axis Label"
      />

    </div>

    <!-- APPEARANCE -->
    <div class="card">

      <div class="section-title">Appearance</div>

      <div id="singleColorControls" class="single-color-controls">

        <label>Bar Fill</label>
        <input
          id="fillColor"
          type="color"
          value="#60a5fa"
        />

      </div>

      <div id="groupColorControls" class="group-color-controls">

        <label>Grouped Bar Palette</label>

        <select id="paletteSelect">

          <option value="bctc">
            BCTC
          </option>

          <option value="classic">
            Classic
          </option>

          <option value="bright">
            Bright
          </option>

          <option value="pastel">
            Pastel
          </option>

          <option value="colorblind">
            Colorblind Friendly
          </option>

        </select>

        <div class="control-note">
          Each group will receive a different color.
        </div>

      </div>

      <label>Bar Border</label>
      <input
        id="borderColor"
        type="color"
        value="#1f2937"
      />

      <label>Fill Opacity</label>
      <input
        id="opacity"
        type="number"
        min="0"
        max="1"
        step="0.1"
        value="0.8"
      />

      <label>Graph Background</label>
      <input
        id="bgColor"
        type="color"
        value="#ffffff"
      />

      <label>Font Family</label>

      <select id="fontFamily">
        <option value="sans-serif">
          Sans-serif
        </option>

        <option value="serif">
          Serif
        </option>

        <option value="monospace">
          Monospace
        </option>

        <option value="cursive">
          Cursive
        </option>
      </select>

      <label>Font Size (px)</label>
      <input
        id="fontSize"
        type="number"
        value="12"
      />

    </div>

    <!-- SIZE & EXPORT -->
    <div class="card">

      <div class="section-title">
        Size & Export
      </div>

      <label>Chart Width (px)</label>
      <input
        id="chartW"
        type="number"
        value="800"
      />

      <label>Chart Height (px)</label>
      <input
        id="chartH"
        type="number"
        value="520"
      />

      <button
        class="btn"
        id="applySizeBtn"
      >
        Apply Size
      </button>

      <button
        class="btn"
        id="downloadPNGBtn"
      >
        Download PNG
      </button>

    </div>

    <!-- PREVIEW -->
    <div class="card">

      <div class="section-title">
        Dataset Preview
      </div>

      <div
        id="preview"
        class="preview"
      ></div>

    </div>

  </aside>


  <!-- CHART -->
  <main class="panel">

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

  </main>

</div>


<script>

let DATA = [];
let HEADERS = [];
let currentChart = null;


/* =========================================================
   COLOR PALETTES
   ========================================================= */

const PALETTES = {

  bctc: [
    '#00467f',
    '#e7a614',
    '#5b9bd5',
    '#a5a5a5',
    '#4472c4',
    '#ffc000',
    '#70ad47',
    '#264478'
  ],

  classic: [
    '#2563eb',
    '#dc2626',
    '#16a34a',
    '#9333ea',
    '#ea580c',
    '#0891b2',
    '#db2777',
    '#65a30d'
  ],

  bright: [
    '#ff3b30',
    '#007aff',
    '#34c759',
    '#ff9500',
    '#af52de',
    '#00c7be',
    '#ff2d55',
    '#5856d6'
  ],

  pastel: [
    '#93c5fd',
    '#fca5a5',
    '#86efac',
    '#d8b4fe',
    '#fdba74',
    '#67e8f9',
    '#f9a8d4',
    '#bef264'
  ],

  colorblind: [
    '#0072B2',
    '#E69F00',
    '#009E73',
    '#CC79A7',
    '#56B4E9',
    '#D55E00',
    '#F0E442',
    '#000000'
  ]

};


/* =========================================================
   HELPERS
   ========================================================= */

function validAlpha(a){

  let x = parseFloat(a);

  if(isNaN(x)){
    x = 0.8;
  }

  if(x < 0){
    x = 0;
  }

  if(x > 1){
    x = 1;
  }

  return x;
}


function hexToRgba(hex, alpha = 1){

  const m =
    /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i
      .exec(hex || '#60a5fa');

  const a = validAlpha(alpha);

  if(!m){
    return `rgba(96,165,250,${a})`;
  }

  const r = parseInt(m[1],16);
  const g = parseInt(m[2],16);
  const b = parseInt(m[3],16);

  return `rgba(${r},${g},${b},${a})`;
}


/* =========================================================
   DATA PREVIEW
   ========================================================= */

function buildTable(rows){

  if(!rows.length){
    return '<div>No data loaded</div>';
  }

  const headers =
    Object.keys(rows[0]);

  let html =
    '<table><thead><tr>' +
    headers
      .map(h => `<th>${h}</th>`)
      .join('') +
    '</tr></thead><tbody>';

  for(const r of rows.slice(0,20)){

    html +=
      '<tr>' +
      headers
        .map(h => `<td>${r[h]}</td>`)
        .join('') +
      '</tr>';

  }

  html += '</tbody></table>';

  return html;
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadFile(file){

  const buf =
    await file.arrayBuffer();

  const wb =
    XLSX.read(
      buf,
      {type:'array'}
    );

  const ws =
    wb.Sheets[
      wb.SheetNames[0]
    ];

  const rows =
    XLSX.utils.sheet_to_json(
      ws,
      {defval:''}
    );

  setData(rows);
}


function setData(rows){

  DATA = rows;

  HEADERS =
    rows.length
      ? Object.keys(rows[0])
      : [];

  const options =
    HEADERS
      .map(
        h =>
          `<option value="${h}">${h}</option>`
      )
      .join('');

  document.getElementById(
    'colSelect'
  ).innerHTML =
    '<option value="">—</option>' +
    options;

  document.getElementById(
    'groupSelect'
  ).innerHTML =
    '<option value="">None</option>' +
    options;

  document.getElementById(
    'preview'
  ).innerHTML =
    buildTable(DATA);
}


/* =========================================================
   SINGLE VARIABLE SUMMARY
   ========================================================= */

function summarizeCategorical(col){

  const counts = {};
  let total = 0;

  for(const r of DATA){

    let v =
      r[col] !== undefined &&
      r[col] !== null
        ? String(r[col]).trim()
        : '';

    if(v === ''){
      continue;
    }

    counts[v] =
      (counts[v] || 0) + 1;

    total++;

  }

  const entries =
    Object.entries(counts)
      .sort(
        (a,b) =>
          b[1] - a[1]
      );

  return {

    labels:
      entries.map(e => e[0]),

    values:
      entries.map(e => e[1]),

    total

  };
}


/* =========================================================
   GROUPED SUMMARY
   ========================================================= */

function summarizeGrouped(
  categoryCol,
  groupCol
){

  const counts = {};
  const categoryTotals = {};
  const groupSet = new Set();

  let total = 0;

  for(const row of DATA){

    const category =
      row[categoryCol] !== undefined &&
      row[categoryCol] !== null
        ? String(row[categoryCol]).trim()
        : '';

    const group =
      row[groupCol] !== undefined &&
      row[groupCol] !== null
        ? String(row[groupCol]).trim()
        : '';

    if(
      category === '' ||
      group === ''
    ){
      continue;
    }

    groupSet.add(group);

    if(!counts[category]){

      counts[category] = {};
      categoryTotals[category] = 0;

    }

    counts[category][group] =
      (counts[category][group] || 0) + 1;

    categoryTotals[category]++;

    total++;

  }


  const categories =
    Object.keys(counts)
      .sort(
        (a,b) =>
          categoryTotals[b] -
          categoryTotals[a]
      );


  const groups =
    Array.from(groupSet)
      .sort(
        (a,b) =>
          a.localeCompare(
            b,
            undefined,
            {
              numeric:true,
              sensitivity:'base'
            }
          )
      );


  return {

    counts,
    categories,
    groups,
    total

  };
}


/* =========================================================
   SIZE
   ========================================================= */

function applySize(){

  const wrap =
    document.querySelector(
      '.chart-wrap'
    );

  const h =
    parseInt(
      document.getElementById(
        'chartH'
      ).value,
      10
    );

  const w =
    parseInt(
      document.getElementById(
        'chartW'
      ).value,
      10
    );


  if(!isNaN(h)){
    wrap.style.height =
      h + 'px';
  }


  if(!isNaN(w)){
    wrap.style.width =
      w + 'px';
  }else{
    wrap.style.width =
      '100%';
  }
}


/* =========================================================
   BACKGROUND PLUGIN
   ========================================================= */

const backgroundPlugin = {

  id:'custom_bgcolor',

  beforeDraw:(chart)=>{

    const ctx =
      chart.ctx;

    const bg =
      document.getElementById(
        'bgColor'
      ).value || '#ffffff';

    ctx.save();

    ctx.fillStyle = bg;

    ctx.fillRect(
      0,
      0,
      chart.width,
      chart.height
    );

    ctx.restore();

  }

};


/* =========================================================
   GROUP COLOR UI
   ========================================================= */

function updateColorControls(){

  const grouped =
    document.getElementById(
      'groupSelect'
    ).value !== '';

  document.getElementById(
    'singleColorControls'
  ).classList.toggle(
    'hidden',
    grouped
  );

  document.getElementById(
    'groupColorControls'
  ).classList.toggle(
    'active',
    grouped
  );

}


/* =========================================================
   DRAW CHART
   ========================================================= */

function drawBar(){

  const col =
    document.getElementById(
      'colSelect'
    ).value;

  const groupCol =
    document.getElementById(
      'groupSelect'
    ).value;

  const summary =
    document.getElementById(
      'summary'
    ).value;


  if(!col){

    alert('Pick a column');

    return;

  }


  if(
    groupCol &&
    groupCol === col
  ){

    alert(
      'Column and Group by must be different variables.'
    );

    return;

  }


  applySize();


  if(currentChart){
    currentChart.destroy();
  }


  const fontFamily =
    document.getElementById(
      'fontFamily'
    ).value;

  const fontSize =
    parseInt(
      document.getElementById(
        'fontSize'
      ).value,
      10
    ) || 12;


  const chartTitle =
    document.getElementById(
      'titleInput'
    ).value ||

    (
      groupCol
        ? `${col} by ${groupCol}`
        : col
    );


  const xlabel =
    document.getElementById(
      'xlabelInput'
    ).value || col;


  const ylabel =
    document.getElementById(
      'ylabelInput'
    ).value ||

    (
      summary === 'percent'
        ? 'Percent'
        : 'Count'
    );


  const borderColor =
    document.getElementById(
      'borderColor'
    ).value;


  const alpha =
    validAlpha(
      document.getElementById(
        'opacity'
      ).value
    );


  let labels;
  let datasets;


  /* =====================================================
     GROUPED BAR CHART
     ===================================================== */

  if(groupCol){

    const grouped =
      summarizeGrouped(
        col,
        groupCol
      );


    if(grouped.total === 0){

      alert(
        'No usable observations were found.'
      );

      return;

    }


    labels =
      grouped.categories;


    const paletteName =
      document.getElementById(
        'paletteSelect'
      ).value;


    const palette =
      PALETTES[paletteName] ||
      PALETTES.bctc;


    datasets =
      grouped.groups.map(
        (group,index)=>{

          const rawValues =
            grouped.categories.map(
              category =>
                grouped.counts[category][group] || 0
            );


          const values =
            summary === 'percent'

              ? rawValues.map(
                  n =>
                    100 *
                    n /
                    grouped.total
                )

              : rawValues;


          const color =
            palette[
              index %
              palette.length
            ];


          return {

            label:group,

            data:values,

            backgroundColor:
              hexToRgba(
                color,
                alpha
              ),

            borderColor:
              borderColor,

            borderWidth:1

          };

        }
      );

  }


  /* =====================================================
     NORMAL BAR CHART
     ===================================================== */

  else{

    const result =
      summarizeCategorical(col);


    labels =
      result.labels;


    const values =
      summary === 'percent' &&
      result.total > 0

        ? result.values.map(
            n =>
              100 *
              n /
              result.total
          )

        : result.values;


    const fillColor =
      document.getElementById(
        'fillColor'
      ).value;


    datasets = [

      {

        label:col,

        data:values,

        backgroundColor:
          hexToRgba(
            fillColor,
            alpha
          ),

        borderColor:
          borderColor,

        borderWidth:1

      }

    ];

  }


  /* =====================================================
     CREATE CHART
     ===================================================== */

  currentChart =
    new Chart(
      document.getElementById(
        'chart'
      ),
      {

        type:'bar',

        data:{

          labels,
          datasets

        },

        options:{

          responsive:true,

          maintainAspectRatio:false,

          plugins:{

            legend:{

              display:
                !!groupCol,

              labels:{

                font:{

                  family:fontFamily,
                  size:fontSize

                }

              }

            },


            title:{

              display:true,

              text:chartTitle,

              font:{

                family:fontFamily,
                size:fontSize + 2

              }

            },


            tooltip:{

              callbacks:{

                label:(ctx)=>{

                  const value =
                    ctx.parsed.y;

                  const prefix =
                    groupCol
                      ? ctx.dataset.label + ': '
                      : '';

                  return (
                    prefix +
                    (
                      summary === 'percent'
                        ? value.toFixed(1) + '%'
                        : value
                    )
                  );

                }

              },

              bodyFont:{

                family:fontFamily,
                size:fontSize

              }

            }

          },


          scales:{

            x:{

              title:{

                display:!!xlabel,

                text:xlabel,

                font:{

                  family:fontFamily,
                  size:fontSize

                }

              },

              ticks:{

                font:{

                  family:fontFamily,
                  size:fontSize

                }

              }

            },


            y:{

              beginAtZero:true,

              title:{

                display:!!ylabel,

                text:ylabel,

                font:{

                  family:fontFamily,
                  size:fontSize

                }

              },

              ticks:{

                font:{

                  family:fontFamily,
                  size:fontSize

                },

                callback:(v)=>
                  summary === 'percent'
                    ? v + '%'
                    : v

              }

            }

          }

        },

        plugins:[
          backgroundPlugin
        ]

      }
    );

}


/* =========================================================
   LIVE APPEARANCE UPDATE
   ========================================================= */

function refreshChartAppearance(){

  if(!currentChart){
    return;
  }

  drawBar();

}


function refreshBg(){

  if(!currentChart){
    return;
  }

  currentChart.update();

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadPNG(){

  if(!currentChart){
    return;
  }

  const a =
    document.createElement(
      'a'
    );

  a.href =
    currentChart.toBase64Image();

  a.download =
    'bar-chart.png';

  a.click();

}


/* =========================================================
   SAMPLE DATA
   ========================================================= */

const SAMPLE = [

  {Snack:"Chips",Class:"A",Day:"Mon"},
  {Snack:"Cookies",Class:"A",Day:"Mon"},
  {Snack:"Fruit",Class:"A",Day:"Tue"},
  {Snack:"Fruit",Class:"B",Day:"Tue"},
  {Snack:"Chips",Class:"B",Day:"Wed"},
  {Snack:"Fruit",Class:"B",Day:"Wed"},
  {Snack:"Cookies",Class:"C",Day:"Thu"},
  {Snack:"Chips",Class:"C",Day:"Thu"},
  {Snack:"Fruit",Class:"C",Day:"Fri"},
  {Snack:"",Class:"C",Day:"Fri"}

];


/* =========================================================
   EVENTS
   ========================================================= */

window.addEventListener(
  'DOMContentLoaded',
  ()=>{


    document.getElementById(
      'loadBtn'
    ).onclick =
      ()=>{

        const f =
          document.getElementById(
            'file'
          ).files[0];

        if(f){
          loadFile(f);
        }

      };


    document.getElementById(
      'sampleBtn'
    ).onclick =
      ()=>{
        setData(SAMPLE);
      };


    document.getElementById(
      'drawBarBtn'
    ).onclick =
      drawBar;


    document.getElementById(
      'downloadPNGBtn'
    ).onclick =
      downloadPNG;


    document.getElementById(
      'applySizeBtn'
    ).onclick =
      applySize;


    document.getElementById(
      'groupSelect'
    ).addEventListener(
      'change',
      updateColorControls
    );


    [
      'fillColor',
      'borderColor',
      'opacity',
      'paletteSelect',
      'fontFamily',
      'fontSize'
    ].forEach(
      id=>{

        document.getElementById(
          id
        ).addEventListener(
          'change',
          refreshChartAppearance
        );

      }
    );


    document.getElementById(
      'bgColor'
    ).addEventListener(
      'input',
      refreshBg
    );


    document.getElementById(
      'bgColor'
    ).addEventListener(
      'change',
      refreshBg
    );


    updateColorControls();

  }
);

</script>

</body>
</html>
